<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Modal Test</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1>CRUD Modal Function Test</h1>
        <p>This page tests the CRUD modal functions without requiring authentication.</p>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Functions</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary" onclick="testWilayahModal()">
                                <i class="fas fa-map-marked-alt me-2"></i>Test Wilayah Modal
                            </button>
                            <button type="button" class="btn btn-success" onclick="testMajelisModal()">
                                <i class="fas fa-mosque me-2"></i>Test Majelis Modal
                            </button>
                            <button type="button" class="btn btn-danger" onclick="testPetugasModal()">
                                <i class="fas fa-user-tie me-2"></i>Test Petugas Modal
                            </button>
                            <button type="button" class="btn btn-info" onclick="testUserModal()">
                                <i class="fas fa-users me-2"></i>Test User Modal
                            </button>
                            <button type="button" class="btn btn-warning" onclick="testChangePasswordModal()">
                                <i class="fas fa-key me-2"></i>Test Change Password
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="testResults">
                            <p class="text-muted">Click test buttons to see results...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Include the necessary JS files -->
    <script src="js/crud.js"></script>
    <script src="js/missing_functions.js"></script>

    <script>
        // Mock global variables
        const USER_ROLE = 'admin';
        const USER_WILAYAH = null;
        const APP_URL = 'http://localhost/majelis';

        // Mock functions
        function showNotification(message, type) {
            const result = `<div class="alert alert-${type} alert-dismissible fade show">
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'} me-2"></i>
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
            $('#testResults').prepend(result);
        }

        function showLoading() {
            showNotification('Loading...', 'info');
        }

        function hideLoading() {
            // Mock implementation
        }

        function updateStatistics() {
            // Mock implementation
        }

        function refreshMap() {
            // Mock implementation
        }

        function loadAssignments() {
            // Mock implementation
        }

        // Test functions
        function testWilayahModal() {
            try {
                if (typeof openWilayahModal === 'function') {
                    openWilayahModal();
                    showNotification('openWilayahModal function called successfully', 'success');
                } else {
                    showNotification('openWilayahModal function not found', 'warning');
                }
            } catch (error) {
                showNotification('Error calling openWilayahModal: ' + error.message, 'danger');
            }
        }

        function testMajelisModal() {
            try {
                if (typeof openMajelisModal === 'function') {
                    openMajelisModal();
                    showNotification('openMajelisModal function called successfully', 'success');
                } else {
                    showNotification('openMajelisModal function not found', 'warning');
                }
            } catch (error) {
                showNotification('Error calling openMajelisModal: ' + error.message, 'danger');
            }
        }

        function testPetugasModal() {
            try {
                if (typeof openPetugasModal === 'function') {
                    openPetugasModal();
                    showNotification('openPetugasModal function called successfully', 'success');
                } else {
                    showNotification('openPetugasModal function not found', 'warning');
                }
            } catch (error) {
                showNotification('Error calling openPetugasModal: ' + error.message, 'danger');
            }
        }

        function testUserModal() {
            try {
                if (typeof openUserModal === 'function') {
                    openUserModal();
                    showNotification('openUserModal function called successfully', 'success');
                } else {
                    showNotification('openUserModal function not found', 'warning');
                }
            } catch (error) {
                showNotification('Error calling openUserModal: ' + error.message, 'danger');
            }
        }

        function testChangePasswordModal() {
            try {
                if (typeof openChangePasswordModal === 'function') {
                    openChangePasswordModal();
                    showNotification('openChangePasswordModal function called successfully', 'success');
                } else {
                    showNotification('openChangePasswordModal function not found', 'warning');
                }
            } catch (error) {
                showNotification('Error calling openChangePasswordModal: ' + error.message, 'danger');
            }
        }

        // Check function availability on page load
        $(document).ready(function() {
            setTimeout(function() {
                const functions = [
                    'openWilayahModal', 'openMajelisModal', 'openPetugasModal',
                    'openUserModal', 'openChangePasswordModal', 'editWilayah',
                    'deleteWilayah', 'editMajelis', 'deleteMajelis',
                    'editPetugas', 'deletePetugas'
                ];

                let availableFunctions = [];
                let missingFunctions = [];

                functions.forEach(function(funcName) {
                    if (typeof window[funcName] === 'function') {
                        availableFunctions.push(funcName);
                    } else {
                        missingFunctions.push(funcName);
                    }
                });

                const result = `
                    <div class="mb-3">
                        <strong>Available Functions (${availableFunctions.length}):</strong>
                        <ul class="list-unstyled">
                            ${availableFunctions.map(f => `<li class="text-success">✓ ${f}</li>`).join('')}
                        </ul>
                    </div>
                    <div>
                        <strong>Missing Functions (${missingFunctions.length}):</strong>
                        <ul class="list-unstyled">
                            ${missingFunctions.map(f => `<li class="text-danger">✗ ${f}</li>`).join('')}
                        </ul>
                    </div>
                `;

                $('#testResults').html(result);
            }, 1000);
        });
    </script>
</body>
</html>
